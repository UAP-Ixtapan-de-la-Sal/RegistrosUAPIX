<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Denegado - UAPIX</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .error-container {
            background: #ffffff;
            border: 2px solid #333;
            width: 450px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            border-radius: 4px;
        }
        h1 {
            color: #d9534f;
            font-size: 24px;
            margin-top: 0;
        }
        p {
            font-size: 14px;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn-volver {
            background-color: #fff;
            border: 2px solid #333;
            color: #000;
            padding: 10px 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }
        .btn-volver:hover {
            background-color: #333;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <h1>🚫 ACCESO DENEGADO</h1>
        <p>Lo sentimos, <strong>{{ request.user.username }}</strong>. Tu cuenta no cuenta con los permisos necesarios para ingresar a este módulo. Si consideras que esto es un error, contacta al administrador.</p>
        <a href="{% url 'homePage' %}" class="btn-volver">REGRESAR AL INICIO</a>
    </div>

</body>
</html>
