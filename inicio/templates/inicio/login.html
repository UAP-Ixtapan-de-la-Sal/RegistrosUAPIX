{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --card: rgba(15, 23, 42, 0.78);
      --primary: #38bdf8;
      --primary-dark: #0ea5e9;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --input: rgba(148, 163, 184, 0.12);
      --border: rgba(148, 163, 184, 0.2);
      --shadow: rgba(15, 23, 42, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    .login-card {
      width: min(100%, 420px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 20px 45px var(--shadow);
      backdrop-filter: blur(8px);
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      font-size: 28px;
      font-weight: bold;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.9rem;
      letter-spacing: 0.02em;
    }

    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.9rem;
      color: var(--muted);
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 14px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .remember input {
      accent-color: var(--primary);
    }

    .forgot {
      color: var(--primary);
      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    button {
      padding: 14px 18px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      box-shadow: 0 10px 18px rgba(14, 165, 233, 0.3);
    }

    button:hover {
      transform: translateY(-1px);
    }

    .signup {
      text-align: center;
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .signup a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .signup a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="logo">U</div>
      <h1>Bienvenido</h1>
      <p>Inicia sesión en tu cuenta</p>
    </div>

    <form method="POST">
    {% csrf_token %}
    
    <!-- Mostrar mensajes de error si la validación falla -->
    {% if messages %}
        {% for message in messages %}
            <p style="color: red;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <div>
        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" name="usuario" required>
    </div>

    <div>
        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena" required>
    </div>

    <div>
        <label>
            <!-- Checkbox de Recuérdame -->
            <input type="checkbox" name="recuerdame"> Recuérdame (1 min)
        </label>
    </div>

    <button type="submit">Iniciar Sesión</button>
</form>
  </div>
</body>
</html>
